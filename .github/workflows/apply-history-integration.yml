name: Apply history integration refactor

on:
  push:
    branches:
      - fix/history-integrity-20260731
    paths:
      - "tools/apply_history_integration.py"
      - ".github/workflows/apply-history-integration.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/history-integrity-20260731
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact source refactor
        run: python tools/apply_history_integration.py

      - name: Validate intended diff
        run: |
          git diff --check
          git diff --exit-code -- history_store.py tests/test_history_store.py .gitignore || true
          git diff -- dividend_scanner.py

      - name: Validate syntax
        run: python -m py_compile dividend_scanner.py history_store.py tests/test_history_store.py

      - name: Run offline tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit integrated scanner source
        run: |
          if git diff --quiet -- dividend_scanner.py; then
            echo "No scanner change produced; refusing to continue." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dividend_scanner.py
          git commit -m "fix: integrate crash-safe history storage"
          git push origin HEAD:fix/history-integrity-20260731
