name: Apply Telegram delivery truth refactor

on:
  push:
    branches:
      - fix/telegram-delivery-truth-20260731
    paths:
      - "tools/apply_telegram_delivery_truth.py"
      - ".github/workflows/apply-telegram-delivery-truth.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/telegram-delivery-truth-20260731
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact-anchor refactor
        run: python tools/apply_telegram_delivery_truth.py

      - name: Validate syntax and tests
        run: |
          bash -n run_bot.sh
          python -m py_compile \
            dividend_scanner.py \
            history_store.py \
            telegram_delivery.py \
            tools/history_recovery.py \
            tools/run_production_scan.py \
            tests/test_history_recovery.py \
            tests/test_history_store.py \
            tests/test_production_runner.py \
            tests/test_scanner_history_integration.py \
            tests/test_scanner_telegram_integration.py \
            tests/test_telegram_delivery.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            dividend_scanner.py \
            tools/run_production_scan.py \
            tests/test_production_runner.py \
            .github/workflows/scanner-reliability.yml
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix: make Telegram delivery outcomes truthful"
          git push origin HEAD:fix/telegram-delivery-truth-20260731
