name: OCI deployment validation

on:
  pull_request:
    paths:
      - "deploy/oci/**"
      - ".github/workflows/oci-deployment-ci.yml"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate shell syntax
        run: |
          bash -n deploy/oci/bootstrap.sh
          bash -n deploy/oci/configure.sh
          bash -n deploy/oci/run-scanner.sh
          bash -n deploy/oci/watchdog.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Generate Terraform formatting patch
        run: |
          terraform -chdir=deploy/oci fmt -recursive
          git diff -- deploy/oci > terraform-fmt.patch

      - name: Upload Terraform formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: terraform-fmt-patch
          path: terraform-fmt.patch

      - name: Check Terraform formatting
        run: git diff --exit-code -- deploy/oci

      - name: Initialize Terraform without backend
        run: terraform -chdir=deploy/oci init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=deploy/oci validate

      - name: Confirm scanner source is unchanged
        run: git diff --exit-code origin/main...HEAD -- dividend_scanner.py
